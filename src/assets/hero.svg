<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#061827"/>
    <stop offset=".55" stop-color="#0a2439"/>
    <stop offset="1" stop-color="#123653"/>
  </linearGradient>
  <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#a55c32"/>
    <stop offset="1" stop-color="#4f2b22"/>
  </linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#061827"/>
    <stop offset="1" stop-color="#0c304b"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#efa04c" stop-opacity=".32"/>
    <stop offset="1" stop-color="#efa04c" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1920" height="640" fill="url(#bg)"/>
<circle cx="1510" cy="280" r="350" fill="url(#glow)"/>
<path d="M920 640 C1100 500 1280 510 1490 410 C1700 310 1810 160 1920 125 V640Z"
      fill="#1a4567" opacity=".18"/>

<!-- Left typography -->
<g font-family="Arial, Helvetica, sans-serif">
  <text x="88" y="82" fill="#91b9d8" font-size="22" letter-spacing="7">SOFTWARE ENGINEER</text>
  <line x1="490" y1="75" x2="625" y2="75" stroke="#47b3e8" stroke-width="2"/>

  <text x="88" y="168" fill="#f7f8fa" font-size="61" font-weight="700">Practical Solutions</text>
  <text x="88" y="235" fill="#f7f8fa" font-size="61" font-weight="700">for Complex Systems</text>

  <text x="90" y="296" fill="#cbd6df" font-size="24">
    I build, maintain, and modernize software that works in the real world—
  </text>
  <text x="90" y="333" fill="#cbd6df" font-size="24">
    from backend services and APIs to desktop and web applications.
  </text>
</g>

<!-- Technology marks -->
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
  <!-- C++ -->
  <g transform="translate(105 395)">
    <polygon points="0,-27 26,-14 26,14 0,27 -26,14 -26,-14" fill="#3e80bb"/>
    <text x="-4" y="8" fill="#fff" font-size="23" font-weight="700">C</text>
    <text x="13" y="3" fill="#fff" font-size="11" font-weight="700">++</text>
    <text y="50" fill="#d8e2ea" font-size="15">C++</text>
  </g>

  <!-- Python -->
  <g transform="translate(200 395)">
    <rect x="-20" y="-20" width="33" height="26" rx="8" fill="#3776ab"/>
    <rect x="-13" y="-7" width="33" height="26" rx="8" fill="#ffd343"/>
    <circle cx="4" cy="-13" r="2" fill="#fff"/>
    <circle cx="-4" cy="12" r="2" fill="#fff"/>
    <text y="50" fill="#d8e2ea" font-size="15">Python</text>
  </g>

  <!-- Qt -->
  <g transform="translate(295 395)">
    <rect x="-24" y="-24" width="48" height="48" rx="5" fill="#41cd52"/>
    <text x="-4" y="9" fill="#fff" font-size="28" font-weight="700">Q</text>
    <text x="13" y="9" fill="#fff" font-size="19" font-weight="700">t</text>
    <text y="50" fill="#d8e2ea" font-size="15">Qt</text>
